<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1526" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.6" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="roseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Grid lines -->
  <line x1="256" y1="90" x2="256" y2="422" stroke="#334155" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 1" opacity="0.6" />
  <line x1="90" y1="256" x2="422" y2="256" stroke="#334155" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 1" opacity="0.6" />

  <!-- Neon 'X' on top-left / center diagonal -->
  <g filter="url(#cyanGlow)">
    <line x1="130" y1="130" x2="210" y2="210" stroke="url(#cyanGrad)" stroke-width="26" stroke-linecap="round" />
    <line x1="210" y1="130" x2="130" y2="210" stroke="url(#cyanGrad)" stroke-width="26" stroke-linecap="round" />
  </g>

  <!-- Neon 'O' on bottom-right -->
  <g filter="url(#roseGlow)">
    <circle cx="342" cy="342" r="46" fill="none" stroke="url(#roseGrad)" stroke-width="24" />
  </g>

  <!-- Electric Dot in center -->
  <circle cx="256" cy="256" r="10" fill="#6366f1" />
</svg>
